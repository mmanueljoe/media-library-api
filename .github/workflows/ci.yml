name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: [main, develop]

jobs:
    test:
        name: lint + typecheck + test
        runs-on: ubuntu-latest

        env:
            # Throwaway values. mongodb-memory-server ignores DATABASE_URL,
            # and Cloudinary is mocked in tests/setup/setup.ts. Real secrets
            # belong in GitHub Secrets, not here.
            NODE_ENV: test
            DATABASE_URL: mongodb://placeholder/ci
            JWT_SECRET: ci-jwt-secret-at-least-16-chars-long
            JWT_EXPIRES_IN: 1h
            MAX_FILE_SIZE_MB: "5"
            UPLOAD_DIR: uploads
            LOG_LEVEL: error
            CLOUDINARY_CLOUD_NAME: ci
            CLOUDINARY_API_KEY: ci
            CLOUDINARY_API_SECRET: ci

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node from .nvmrc
              uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: "yarn"

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Lint
              run: yarn lint

            - name: Typecheck
              run: yarn typecheck

            - name: Test with coverage
              run: yarn test:coverage

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-${{ github.run_id }}
                  path: coverage/
                  if-no-files-found: warn
                  retention-days: 14
