name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: [main, develop]

jobs:
    test:
        name: lint + typecheck + test
        runs-on: ubuntu-latest

        env:
            # NODE_ENV only. Everything else comes from the committed .env.test,
            # which src/config/env.ts loads based on this value.
            #
            # This block used to restate every variable, which broke the build:
            # dotenv does not override variables already in process.env, so the
            # values here silently won and any that disagreed with .env.test
            # failed in CI and nowhere else. One source of truth instead.
            #
            # Safe to commit .env.test because every value in it is fake —
            # mongodb-memory-server ignores DATABASE_URL and Cloudinary is mocked
            # in tests/setup/setup.ts. Real secrets belong in GitHub Secrets.
            NODE_ENV: test

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node from .nvmrc
              uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: "yarn"

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Lint
              run: yarn lint

            - name: Format check
              run: yarn format:check

            - name: Typecheck
              run: yarn typecheck

            # Typecheck alone can't catch this: it runs with noEmit, so it never
            # exercises the emitted output. The production build broke once
            # because of unresolved path aliases that only surface here.
            - name: Build
              run: yarn build

            - name: Test with coverage
              run: yarn test:coverage

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-${{ github.run_id }}
                  path: coverage/
                  if-no-files-found: warn
                  retention-days: 14
